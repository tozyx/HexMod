name: Build NeoForge jar

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "21.0.5"

jobs:
  build-neoforge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge
        run: |
          chmod +x gradlew
          ./gradlew :Neoforge:build --stacktrace

      - name: Collect mod jar
        run: |
          mkdir -p dist
          find Neoforge/build/libs -maxdepth 1 -type f \
            -name 'hexcasting-neoforge-*.jar' \
            ! -name '*-dev-shadow.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} dist/ \;
          test -n "$(ls -A dist)"
          ls -lh dist

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: hexcasting-neoforge-${{ github.run_number }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
